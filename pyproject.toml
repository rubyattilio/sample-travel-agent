[project]
name = "arize-fde-agent"
version = "0.1.0"
description = "A simple AI travel agent (CLI + FastAPI) built on the Anthropic API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic==1.17.0",
    "arize-otel==0.14.1",
    "fastapi==0.139.0",
    "httpx==0.28.1",
    "openinference-instrumentation-anthropic==3.3.5",
    "python-dotenv==1.2.2",
    "uvicorn[standard]==0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
